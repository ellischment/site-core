name: check

# Все проверки идут здесь и локально, а не на сервере: у него 1 ГБ памяти.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:${{ github.workspace }}/prisma/data/ci.db"
      ENCRYPTION_KEY: "ci-encryption-key-not-real-000000000"
      CRON_SECRET: "ci-cron-secret-not-real"
      NEXT_PUBLIC_SITE_URL: "https://ci.example.invalid"
      # Только для сквозных сценариев, не боевые значения.
      SEED_OWNER_EMAIL: "owner@ci.example.invalid"
      SEED_OWNER_PASSWORD: "ci-owner-password-not-real"
      SEED_ADMIN_EMAIL: "admin@ci.example.invalid"
      SEED_ADMIN_PASSWORD: "ci-admin-password-not-real"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Миграция и сид
        run: npx prisma migrate deploy && npm run seed

      - name: Типы
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      - name: Модульные тесты
        run: npm run test:unit

      - name: Сборка
        run: npm run build

      - name: Браузер для сквозных тестов
        run: npx playwright install --with-deps chromium

      - name: Сквозные тесты
        run: npm run test:e2e
